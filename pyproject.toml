[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "agentdbg"
version = "0.1.0"
description = "Prototype for deterministic agent recording and replay"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"

[project.scripts]
agentdbg = "agentdbg.cli:main"
